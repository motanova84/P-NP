name: 🌊 NOESIS E2E Total Validation & Core Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ========================================================
  # CAPA 1: Validación Formal en Lean 4 (Verificación Estricta)
  # ========================================================
  lean-formal-proofs:
    name: "Capa 1: Formalización Lean 4"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar elenv y Lean 4 Toolchain
        uses: leanprover/lean4-action@v1

      - name: Verificar dependencias y construir Kernel
        run: |
          lake exe cache get
          lake build NOESIS.Complete NOESIS.Oracle

      - name: Auditoría de Axiomas y 'sorry'
        run: |
          ! grep -r "sorry" NOESIS/Complete.lean

  # ========================================================
  # CAPA 2: Pruebas Unitarias del Solver y API (Python)
  # ========================================================
  python-solver-tests:
    name: "Capa 2: Solver & API Python"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Ejecutar Test Suite del Solver
        run: pytest tests/ -v --durations=0

  # ========================================================
  # CAPA 3: Contratos Inteligentes y Verificación EVM (Foundry)
  # ========================================================
  solidity-contracts:
    name: "Capa 3: Contratos Solidity (Foundry)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Compilación y Pruebas Unitarias/Fuzzing
        run: |
          forge build --sizes
          forge test -vvv

  # ========================================================
  # CAPA 4: Orquestación E2E en Contenedores & Integración
  # ========================================================
  e2e-docker-validation:
    name: "Capa 4: Integración E2E Dockerizada"
    needs: [lean-formal-proofs, python-solver-tests, solidity-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar Entorno Docker Compose
        run: docker compose -f docker-compose.noesis.yml up -d --build

      - name: Healthcheck de API & Servicio de Resonancia
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:8000/health | grep -q "ok"; do sleep 2; done'

      - name: Ejecutar Sonda de Integración End-to-End
        run: python scripts/test_e2e_integration.py

      - name: Desmantelar Entorno
        if: always()
        run: docker compose -f docker-compose.noesis.yml down -v
