version: '3.8'

networks:
  philock-mesh:
    driver: bridge

services:
  philock-node-1:
    build: .
    container_name: philock-node-1
    environment:
      - NODE_ID=1
    ports:
      - "50051:50051"
      - "8080:8080"
    networks:
      - philock-mesh

  philock-node-2:
    build: .
    container_name: philock-node-2
    environment:
      - NODE_ID=2
    ports:
      - "50052:50051"
      - "8081:8080"
    networks:
      - philock-mesh

  philock-node-3:
